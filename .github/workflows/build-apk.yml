```yaml
name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          flutter --version
          dart --version

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in repository root."
            exit 1
          fi

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/gradlew ] && [ ! -f android/gradlew.bat ]; then
            echo "Android platform files missing. Generating them..."
            flutter create \
              --platforms=android \
              --project-name solo_player \
              --org com.touheed \
              .
          else
            echo "Existing Android platform files found."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Check Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created at $APK_PATH"
            find build -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APK_PATH" SoloPlayer.apk
          ls -lh SoloPlayer.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoloPlayer-apk
          path: SoloPlayer.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Solo Player v1.0.${{ github.run_number }}
          body: "Automated release build of Solo Player."
          files: SoloPlayer.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
