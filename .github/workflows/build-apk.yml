name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name solo_player --org com.touheed /tmp/gen
          mkdir -p android
          cp -rn /tmp/gen/android/. android/
          find android/app/src/main -name 'MainActivity.java' -delete

      - name: Fix Gradle & Android SDK settings
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-build.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  def androidExt = project.extensions.findByName('android')
                  if (androidExt != null) {
                      try {
                          androidExt.compileSdkVersion 34
                          if (androidExt.hasProperty('defaultConfig') && androidExt.defaultConfig != null) {
                              androidExt.defaultConfig.targetSdkVersion 34
                              androidExt.defaultConfig.minSdkVersion 21
                          }
                      } catch (Exception e) {}
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SoloPlayer.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoloPlayer-apk
          path: SoloPlayer.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Solo Player v1.0.${{ github.run_number }}
          body: "Automatic release build of Solo Player."
          files: SoloPlayer.apk
